<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PlateSaver | Restaurant Deals Near You</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>🍽️ PlateSaver</h1>
    <p>Eat out. Spend less.</p>
    <p>Find restaurant deals happening around St. Pete.</p>
  </header>

  <main>

    <input
      id="search"
      type="search"
      placeholder="Search restaurants or deals...">
  <button id="location-btn">📍 Use My Location</button>
<p id="location-status"></p>

    <div class="filters">
      <button data-filter="today">🔥 Today</button>
      <button data-filter="under10">💵 Under $10</button>
      <button data-filter="bogo">🎁 BOGO</button>
      <button data-filter="kids">👨‍👩‍👧 Kids Eat Free</button>
      <button data-filter="all">🍽️ All Deals</button>
    </div>

    <p id="results-count"></p>

    <section id="deals">
      <!-- Our restaurant deals will appear here automatically. -->
    </section>

  </main>

  <script src="app.js?v=3"></script>

</body>
</html>
